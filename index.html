<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা ই-কমার্স শপ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600"><i class="fa-solid fa-store mr-2"></i>বাংলা শপ</h1>
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="relative bg-indigo-50 text-indigo-600 px-4 py-2 rounded-full font-medium hover:bg-indigo-100 transition">
                    <i class="fa-solid fa-cart-shopping mr-1"></i> কার্ট 
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Hero Section -->
        <section class="bg-indigo-600 text-white rounded-2xl p-8 mb-8 text-center shadow-lg">
            <h2 class="text-3xl font-bold mb-2">অনলাইন শপিং এখন আরও সহজ!</h2>
            <p class="text-indigo-100 mb-4">আপনার পছন্দের পণ্য কিনুন ঘরে বসেই।</p>
        </section>

        <!-- Categories -->
        <div class="flex space-x-2 overflow-x-auto pb-4 mb-6">
            <button onclick="filterProducts('all')" class="category-btn active px-4 py-2 bg-indigo-600 text-white rounded-full text-sm font-medium whitespace-nowrap shadow-sm">সব পণ্য</button>
            <button onclick="filterProducts('electronics')" class="category-btn px-4 py-2 bg-white text-gray-700 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-gray-200">ইলেকট্রনিক্স</button>
            <button onclick="filterProducts('fashion')" class="category-btn px-4 py-2 bg-white text-gray-700 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-gray-200">ফ্যাশন</button>
            <button onclick="filterProducts('home')" class="category-btn px-4 py-2 bg-white text-gray-700 rounded-full text-sm font-medium whitespace-nowrap shadow-sm border border-gray-200">হোম অ্যাপ্লায়েন্স</button>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products will load here via JavaScript -->
        </div>
    </main>

    <!-- Cart Sidebar/Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-z-50 bg-opacity-50 hidden justify-end z-50">
        <div class="bg-w white w-full max-w-md h-full bg-white p-6 flex flex-col shadow-xl">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="text-xl font-bold">আপনার শপিং কার্ট</h3>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="cart-items" class="flex-1 overflow-y-auto py-4 space-y-4">
                <!-- Cart items will appear here -->
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>মোট টাকা:</span>
                    <span id="cart-total">৳০</span>
                </div>
                <button onclick="checkout()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition">অর্ডার কনফার্ম করুন</button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        const products = [
            { id: 1, name: "স্মার্ট ওয়াচ", price: 2500, category: "electronics", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300" },
            { id: 2, name: "ওয়্যারলেস হেডফোন", price: 3200, category: "electronics", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" },
            { id: 3, name: "স্টাইলিশ জ্যাকেট", price: 1800, category: "fashion", image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=300" },
            { id: 4, name: "ক্যাজুয়াল স্নিকার্স", price: 2200, category: "fashion", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" },
            { id: 5, name: "ব্লেন্ডার মেশিন", price: 4500, category: "home", image: "https://images.unsplash.com/photo-1570222094114-d074f7e1e6e5?w=300" },
            { id: 6, name: "টেবিল ল্যাম্প", price: 1200, category: "home", image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=300" }
        ];

        let cart = [];

        function renderProducts(filter = 'all') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-lg mb-1">${p.name}</h3>
                                <p class="text-indigo-600 font-bold mb-4">৳${p.price}</p>
                            </div>
                            <button onclick="addToCart(${p.id})" class="w-full bg-indigo-50 text-indigo-600 py-2 rounded-xl font-medium hover:bg-indigo-600 hover:text-white transition">কার্টে যোগ করুন</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-700');
            });
            event.target.classList.remove('bg-white', 'text-gray-700');
            event.target.classList.add('bg-indigo-600', 'text-white');
            renderProducts(category);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
            alert(`${product.name} কার্টে যোগ করা হয়েছে!`);
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = '';
            
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2">
                        <div>
                            <h4 class="font-medium">${item.name}</h4>
                            <p class="text-sm text-gray-500">৳${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 text-sm">ডিলিট</button>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = `৳${total}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        function checkout() {
            if(cart.length === 0) {
                alert('আপনার কার্ট খালি!');
                return;
            }
            alert('আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে! ধন্যবাদ।');
            cart = [];
            updateCart();
            toggleCart();
        }

        renderProducts();
    </script>
</body>
</html>
